appId: com.joaosoarees.trophytracker
productName: Trophy Tracker
copyright: Copyright © 2026 Joao Soares. Not affiliated with Valve or Steam.

directories:
  output: dist
  buildResources: build

# Everything the app runs is already bundled into out/ by electron-vite, so
# node_modules stay out of the package; copying them would ship every library
# twice.
files:
  - out/**
  - build/icon.png
  - package.json
  - '!node_modules'

# Installers are not signed with a paid certificate yet: Windows shows the
# SmartScreen warning and macOS asks the user to allow the app in System Settings.
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Trophy-Tracker-${version}-Windows.${ext}
  # The wizard's pictures are build/installerSidebar.bmp, uninstallerSidebar.bmp
  # and installerHeader.bmp, found by name and drawn by scripts/installer-art.mjs.
  # The wizard speaks the languages the app does, picked after the system's;
  # any other system gets English, as in the app.
  installerLanguages:
    - en_US
    - pt_BR
    - es_ES
    - fr_FR

mac:
  category: public.app-category.utilities
  # Ad-hoc signature: no certificate involved, but without any signature at
  # all an Apple Silicon Mac refuses to start the app. The hardened runtime
  # only makes sense with a real certificate and breaks an ad-hoc signed app.
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [x64, arm64]
dmg:
  # The app builds the download link of its update notice from this name
  # (`Releases.downloadUrl` in main/system/Releases.ts); change both together.
  artifactName: Trophy-Tracker-${version}-macOS-${arch}.${ext}
  # build/background.png (and @2x) is the window's picture: a tray with an
  # arrow from the app, on the left, to Applications, on the right.
  window:
    width: 540
    height: 380
  iconSize: 96
  contents:
    - x: 150
      y: 190
    - x: 390
      y: 190
      type: link
      path: /Applications

linux:
  category: Utility
  # Lets desktop environments tie the running window to its launcher entry.
  syncDesktopName: true
  maintainer: Joao Soares <joaosoarees@users.noreply.github.com>
  synopsis: Tracks your Steam achievements
  target:
    - AppImage
    - deb

# Where the installed app looks for new versions. electron-builder writes this
# into the package and produces the latest*.yml files the updater reads; the
# upload itself is done by the release workflow.
publish:
  provider: github
  owner: joaosoarees
  repo: trophy-tracker

appImage:
  artifactName: Trophy-Tracker-${version}-Linux.${ext}

deb:
  artifactName: Trophy-Tracker-${version}-Linux-Debian-Ubuntu.${ext}
  # electron-builder's default list plus what a minimal system lacks (found by
  # installing the package in a clean container).
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2 | libasound2t64
