# Install scripts are blocked unless listed here.
# esbuild downloads its platform binary; unrs-resolver ships prebuilt binaries and needs no script.
# Electron needs no entry: it downloads its binary on first run.
allowBuilds:
  esbuild: true
  unrs-resolver: false
  # Squirrel installer support that electron-builder pulls in; the app ships NSIS, so its script is not needed.
  electron-winstaller: false
