name: Release

# Pushing a tag such as v1.2.0 builds the installers for the three systems
# and, when all three succeed, publishes them as a release. Installed apps
# find it from there: they update themselves or show the download notice.
# Running it by hand builds the installers without creating a release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          # macOS installers can only be built on macOS; one runner builds
          # both the Intel and the Apple Silicon image.
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches the version in package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi

      - run: pnpm test
      - run: pnpm ${{ matrix.script }}

      - name: Test the Linux package in a clean container
        if: runner.os == 'Linux'
        run: pnpm test:package

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          # The latest*.yml files and the block maps are what the installed
          # app reads to update itself.
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" installers/*
          --repo "$GITHUB_REPOSITORY"
          --title "Trophy Tracker ${GITHUB_REF_NAME#v}"
          --generate-notes
