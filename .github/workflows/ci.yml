name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the coverage upload identify this repository without a secret.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pnpm comes from Corepack, in the version pinned in package.json.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Runs the tests and fails if coverage falls under the thresholds in
      # vitest.config.ts.
      - run: pnpm test:coverage
      # Only the coverage numbers leave, for the badge of the README. A
      # failure to send them does not fail the build.
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: false
      - run: pnpm build
      # The catalogue of components has to keep building: a story that no
      # longer compiles is a component whose documentation is wrong.
      - run: pnpm build-storybook

  # The same tests on the other two systems the app ships for. Twice a release
  # failed on a test that only breaks on Windows (paths, permissions), found
  # when the tag was already pushed; this finds it on the push to main.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
